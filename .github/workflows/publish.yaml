name: Publish

permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      crate_name:
        type: choice
        description: Which crate to publish?
        options:
          - gtk4-layer-shell-sys
          - gtk4-layer-shell
          - gtk4-session-lock-sys
          - gtk4-session-lock
        required: true
      version:
        description: "New version of the crate"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ github.event.inputs.version }}
          CRATE_NAME: ${{ github.event.inputs.crate_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Ezq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$VERSION'. Must be a valid semver (e.g. 0.8.2)."
            exit 1
          fi
          case "$CRATE_NAME" in
            gtk4-layer-shell-sys|gtk4-layer-shell|gtk4-session-lock-sys|gtk4-session-lock) ;;
            *)
              echo "::error::Invalid crate_name '$CRATE_NAME'."
              exit 1
              ;;
          esac
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/install_deps
      - uses: $/.github/actions/install_msrv_toolchain
      - name: Get the version number
        id: previous_version
        env:
          CRATE_NAME: ${{ github.event.inputs.crate_name }}
        run: |
          echo "PREVIOUS_VERSION=$(grep -o -m 1 -P '(?<=version = ").*(?=")' "./${CRATE_NAME}/Cargo.toml")" >> "$GITHUB_OUTPUT"
      - name: Output the version numbers
        env:
          VERSION: ${{ github.event.inputs.version }}
          PREVIOUS_VERSION: ${{ steps.previous_version.outputs.PREVIOUS_VERSION }}
        run: |
          echo "Previous version: ${PREVIOUS_VERSION}"
          echo "New version: ${VERSION}"
      - name: Bump version number in Cargo.toml
        env:
          VERSION: ${{ github.event.inputs.version }}
          PREVIOUS_VERSION: ${{ steps.previous_version.outputs.PREVIOUS_VERSION }}
          CRATE_NAME: ${{ github.event.inputs.crate_name }}
        run: sed -i "0,/version = \"${PREVIOUS_VERSION}\"/{s||version = \"${VERSION}\"|}" "./${CRATE_NAME}/Cargo.toml"
      - name: Bump version of badge in README.md
        env:
          VERSION: ${{ github.event.inputs.version }}
          PREVIOUS_VERSION: ${{ steps.previous_version.outputs.PREVIOUS_VERSION }}
          CRATE_NAME: ${{ github.event.inputs.crate_name }}
        run: sed -i "s|${CRATE_NAME}/${PREVIOUS_VERSION}|${CRATE_NAME}/${VERSION}|g" "./${CRATE_NAME}/README.md"

      - name: Bump version of badge in repo README.md
        env:
          VERSION: ${{ github.event.inputs.version }}
          PREVIOUS_VERSION: ${{ steps.previous_version.outputs.PREVIOUS_VERSION }}
          CRATE_NAME: ${{ github.event.inputs.crate_name }}
        run: sed -i "s|${CRATE_NAME}/${PREVIOUS_VERSION}|${CRATE_NAME}/${VERSION}|g" "./README.md"

      - name: Commit the changes to repo
        env:
          COMMIT_MSG: "Bump version number of ${{ github.event.inputs.crate_name }} and publish it"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "91755244+pentamassiv@users.noreply.github.com"

          # Stage all changes
          git add -A

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "$COMMIT_MSG"
            git push
          fi

      - name: Publish on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        working-directory: ./${{ github.event.inputs.crate_name }}
        run: cargo publish