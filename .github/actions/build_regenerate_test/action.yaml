name: "Build, regenerate and test"
description: "Builds the code, uses gir to regenerate the bindings and runs the tests"

inputs:
  fail_on_dirty:
    description: "Fail if gir regenerate changes tracked sources (use on PR/push CI; disable on update bots)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Check formatting
      shell: bash
      run: |
        set -euo pipefail
        # rustfmt.toml `ignore` needs nightly (unstable_features).
        cargo +nightly fmt --all -- --check

    - name: Build and test sys crates
      shell: bash
      run: |
        set -euo pipefail
        export PATH=$PATH:/github/home/.cargo/bin

        # Newer gir logs parse errors and continues. Gtk-4.0.gir has an empty
        # <type/> on the non-introspectable GtkPrinter:backend property, which
        # produces this harmless message whenever Gtk-4.0.gir is loaded.
        filter_gir_noise() {
          sed '/Skipping property "backend": Missing name attribute on <type> element/d' \
            | sed '/^[[:space:]]*$/d'
        }

        folders=("gtk4-layer-shell" "gtk4-session-lock")
        for folder in "${folders[@]}"; do
          echo "[SYS] Processing crate: ${folder}-sys"
          cd "${folder}-sys"

          echo "🔍 Checking gir output..."
          gir_output=$(gir -o . 2>&1 | filter_gir_noise || true)
          if [[ -n "$gir_output" ]]; then
            echo "::error::[SYS ${folder}] gir -o produced output"
            echo "$gir_output"
            exit 1
          fi

          echo "::group::📦 Running cargo update..."
          cargo update
          echo "::endgroup::"
          echo "::group::🔨 Building (all features)..."
          cargo build --verbose --all-features
          echo "::endgroup::"
          echo "::group::✅ Running tests..."
          cargo test --verbose --all-features
          echo "::endgroup::"
          echo "::group::📚 Building docs..."
          cargo doc --all-features
          echo "::endgroup::"

          cd ..
        done

    - name: Build and test wrapper crates
      shell: bash
      run: |
        set -euo pipefail
        export PATH=$PATH:/github/home/.cargo/bin

        # See comment in the sys crate step above.
        filter_gir_noise() {
          sed '/Skipping property "backend": Missing name attribute on <type> element/d' \
            | sed '/^[[:space:]]*$/d'
        }

        folders=("gtk4-layer-shell" "gtk4-session-lock")
        for folder in "${folders[@]}"; do
          echo "[WRAPPER] Processing crate: ${folder}"
          cd "${folder}"

          echo "🔍 Generating code"
          echo "::group::gir -o output"
          gir_output=$(gir -o . 2>&1 | filter_gir_noise || true)
          echo "$gir_output"
          echo "::endgroup::"
          if [[ -n "$gir_output" ]]; then
            echo "::error::[WRAPPER ${folder}] gir -o produced output"
            exit 1
          fi

          echo "🔍 Checking if some code was not generated"
          echo "::group::gir not_bound output"
          not_bound_output=$(gir -o . -m not_bound 2>&1 | filter_gir_noise || true)
          echo "$not_bound_output"
          echo "::endgroup::"
          if [[ -n "$not_bound_output" ]]; then
            echo "::error::[WRAPPER ${folder}] gir not_bound produced output"
            exit 1
          fi

          echo "🔍 Generating docs"
          echo "::group::gir docs output"
          doc_output=$(gir -c Gir.toml --doc-target-path docs.md -m doc 2>&1 | filter_gir_noise || true)
          echo "$doc_output"
          echo "::endgroup::"
          if [[ -n "$doc_output" ]]; then
            echo "::error::[WRAPPER ${folder}] gir docs produced output"
            exit 1
          fi

          echo "📚 Installing rustdoc-stripper..."
          cargo install rustdoc-stripper --force
          rustdoc-stripper -s -n
          rustdoc-stripper -g -o docs.md

          echo "::group::📦 Running cargo update..."
          cargo update
          echo "::endgroup::"
          echo "::group::🔨 Building (all features)..."
          cargo build --verbose --all-features
          echo "::endgroup::"
          echo "::group::✅ Running tests..."
          cargo test --verbose --all-features
          echo "::endgroup::"
          echo "::group::📚 Building docs..."
          cargo doc --all-features
          echo "::endgroup::"
          echo "::group::📂 Building examples..."
          cargo build --examples --all-features
          echo "::endgroup::"
          cd ..
        done
        cargo build --manifest-path gtk4-layer-shell/examples/relm4/Cargo.toml

    - name: Clippy
      shell: bash
      run: |
        set -euo pipefail
        cargo clippy --workspace --all-features --all-targets -- -D warnings

    - name: Fail if regenerate changed committed sources
      if: inputs.fail_on_dirty == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # versions.txt embeds checkout dirtiness of parent/gir; ignore it.
        if ! git diff --quiet HEAD -- . \
          ':(exclude)gir' \
          ':(exclude)gir-files' \
          ':(exclude)*/src/auto/versions.txt'; then
          echo "::error::gir regenerate changed tracked sources; commit the updated bindings"
          git --no-pager diff -- . \
            ':(exclude)gir' \
            ':(exclude)gir-files' \
            ':(exclude)*/src/auto/versions.txt'
          exit 1
        fi
        echo "Regenerated sources match the commit (ignoring versions.txt)."
