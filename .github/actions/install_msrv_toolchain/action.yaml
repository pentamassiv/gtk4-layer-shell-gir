name: "Install_msrv_toolchain"
description: "Install the Rust toolchain from workspace Cargo.toml rust-version (MSRV)"

inputs:
  components:
    description: "Comma-separated rustup components for the MSRV toolchain"
    required: false
    default: "clippy"

runs:
  using: "composite"
  steps:
    - name: Read MSRV from Cargo.toml
      id: msrv
      shell: bash
      run: |
        set -euo pipefail
        version="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
        if [[ -z "${version}" ]]; then
          echo "::error::Could not read rust-version from Cargo.toml"
          exit 1
        fi
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
        echo "Using MSRV ${version} from Cargo.toml"

    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch
      with:
        toolchain: ${{ steps.msrv.outputs.version }}
        components: ${{ inputs.components }}

    # rustfmt.toml `ignore` is unstable; install nightly rustfmt without changing the
    # default toolchain away from MSRV.
    - name: Install nightly rustfmt
      shell: bash
      run: rustup toolchain install nightly --profile minimal --component rustfmt
