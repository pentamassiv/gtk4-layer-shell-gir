[options]
library = "Gtk4LayerShell"
version = "1.0"
target_path = "."
min_cfg_version = "1.0"
work_mode = "normal"
girs_directories = ["../gir-files", ".."]
generate_safety_asserts = true
deprecate_by_min_version = true
single_version_file = true

generate = [
    "Gtk4LayerShell.Edge",
    "Gtk4LayerShell.Layer",
    "Gtk4LayerShell.KeyboardMode",
]

manual = ["Gtk.Window", "Gdk.Monitor"]

[[object]]
name = "Gtk4LayerShell.*"
status = "generate"
    [[object.function]]
    name = "get_zwlr_layer_surface_v1"
    manual = true
